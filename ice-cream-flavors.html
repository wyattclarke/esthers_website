<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Flavors - Rankings "R" Us</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f9f5f2;
            background-image:
                repeating-linear-gradient(
                    128deg,
                    transparent 0px,
                    rgba(0,0,0,0.85) 1px,
                    rgba(0,0,0,0.4) 2px,
                    transparent 3px,
                    transparent 70px
                ),
                repeating-linear-gradient(
                    52deg,
                    transparent 0px,
                    rgba(0,0,0,0.7) 1px,
                    rgba(0,0,0,0.3) 2px,
                    transparent 3px,
                    transparent 100px
                ),
                linear-gradient(
                    160deg,
                    #ffffff 0%,
                    #f2eeeb 25%,
                    #faf8f6 50%,
                    #ede8e4 75%,
                    #f8f5f2 100%
                );
        }

        header {
            background: linear-gradient(135deg, #e8799e, #c95580);
        }

        header .tagline {
            color: #fce4ee;
        }

        .back-link {
            color: #c95580;
        }

        .ranking-item {
            background: linear-gradient(135deg, #f9c8dc, #f4a7c0);
            border: 2px solid #d4a017;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 35px;
        }

        .ranking-item .rank {
            font-size: 1.5em;
            color: #d4a017;
            font-weight: bold;
        }

        .ranking-item .name {
            font-size: 1.2em;
            color: #7a2040;
            margin: 3px 0;
        }

        .ranking-item .review {
            font-size: 1em;
            color: #a04060;
            line-height: 1.6;
            margin-top: 8px;
        }

        footer {
            background: #c95580;
        }
        .smiley {
            position: fixed;
            pointer-events: none;
            z-index: -1;
            opacity: 1;
            user-select: none;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const smileys = ['😊', '😄', '🙂', '😁', '😀', '😃'];
            const positions = [
                [7, 8], [23, 31], [41, 12], [63, 44], [82, 19],
                [15, 62], [34, 78], [55, 55], [74, 83], [90, 67],
                [5, 45], [28, 90], [48, 33], [70, 10], [88, 50],
                [18, 20], [60, 70], [38, 50], [80, 35], [12, 75],
                [3, 25], [50, 5], [92, 88], [25, 50], [67, 28],
                [43, 92], [9, 88], [77, 55], [32, 15], [58, 82],
                [85, 40], [20, 40], [46, 60], [72, 72], [95, 15],
                [37, 38], [64, 92], [11, 55], [53, 22], [88, 78],
                [2, 60], [16, 35], [30, 5], [44, 70], [57, 40],
                [68, 18], [79, 62], [93, 33], [6, 80], [22, 55],
                [36, 25], [49, 85], [61, 48], [75, 8], [87, 70],
                [13, 42], [27, 68], [42, 18], [56, 92], [71, 38],
                [83, 55], [4, 15], [19, 80], [35, 45], [52, 10],
                [66, 75], [81, 28], [94, 60], [8, 95], [24, 12],
                [40, 65], [54, 35], [69, 85], [84, 18], [97, 45]
            ];
            const sizes = [1.2, 1.6, 1.0, 1.8, 1.3, 1.5, 1.1, 1.7, 1.4, 1.9,
                           1.3, 1.6, 1.0, 1.5, 1.2, 1.8, 1.1, 1.4, 1.7, 1.0,
                           1.6, 1.2, 1.9, 1.3, 1.5, 1.0, 1.8, 1.4, 1.1, 1.7,
                           1.3, 1.5, 1.2, 1.6, 1.0, 1.9, 1.4, 1.1, 1.7, 1.3,
                           1.5, 1.2, 1.8, 1.0, 1.6, 1.3, 1.9, 1.1, 1.4, 1.7,
                           1.2, 1.5, 1.0, 1.8, 1.3, 1.6, 1.1, 1.9, 1.4, 1.7,
                           1.3, 1.0, 1.6, 1.2, 1.8, 1.5, 1.1, 1.7, 1.4, 1.9];
            const rotations = [12, -8, 22, -15, 5, -25, 18, -3, 30, -12,
                               -20, 8, -5, 15, -28, 10, -18, 25, -10, 20,
                               -7, 14, -22, 6, -30, 19, -13, 28, -4, 17,
                               -24, 9, -16, 23, -2, 11, -27, 16, -9, 21,
                               -14, 7, -19, 26, -6, 13, -29, 4, -21, 18,
                               -11, 24, -3, 20, -17, 8, -26, 15, -8, 22,
                               -15, 30, -12, 5, -23, 10, -18, 27, -7, 14];

            positions.forEach(([x, y], i) => {
                const el = document.createElement('div');
                el.className = 'smiley';
                el.textContent = smileys[i % smileys.length];
                el.style.left = x + 'vw';
                el.style.top = y + 'vh';
                el.style.fontSize = sizes[i] + 'em';
                el.style.transform = `rotate(${rotations[i]}deg)`;
                document.body.appendChild(el);
            });
        });
    </script>
</head>
<body>
<div class="corner-band corner-tl"></div>
    <div class="corner-band corner-tr"></div>
    <div class="corner-band corner-bl"></div>
    <div class="corner-band corner-br"></div>

    <header>
        <h1>Rankings "R" Us</h1>
        <p class="tagline">Ice Cream Flavors</p>
    </header>

    <a href="index.html" class="back-link">&larr; Back to all topics</a>

    <div class="rankings">
        <div class="ranking-item">
            <div class="rank">#1</div>
            <div class="name">Pistachio</div>
            <div class="review"></div>
        </div>

        <div class="ranking-item">
            <div class="rank">#2</div>
            <div class="name">Cherry</div>
            <div class="review"></div>
        </div>

        <div class="ranking-item">
            <div class="rank">#3</div>
            <div class="name">Vanilla with Sprinkles</div>
            <div class="review"></div>
        </div>

        <div class="ranking-item">
            <div class="rank">#4</div>
            <div class="name">Matcha</div>
            <div class="review"></div>
        </div>

        <!-- More rankings coming soon! -->
    </div>

    <footer>
        <p>Rankings "R" Us &copy; 2026</p>
    </footer>
    <script src="sparkles.js"></script>
</body>
</html>
